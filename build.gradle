plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_name
}

repositories {
    maven {
        name = 'tom5454'
        url = 'https://raw.githubusercontent.com/tom5454/maven/main'
        content {
            includeGroup 'com.tom5454.cpm'
        }
    }
}

sourceSets {
    // Stand-ins for classes of other mods that are only there at run time
    // (Player Animation Library). Used to compile, never packed into the jar.
    stubs {
        java {
            srcDir 'src/stubs/java'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // The CPM API jar holds CPM's shared code, which is the same on every Minecraft version.
    compileOnly "com.tom5454.cpm:CustomPlayerModels-API:${project.cpm_api_version}"
    compileOnly sourceSets.stubs.output
}

processResources {
    def version = project.version
    inputs.property 'version', version
    filesMatching('fabric.mod.json') {
        expand 'version': version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    def projectName = project.name
    inputs.property 'projectName', projectName
    from('LICENSE') {
        rename { "${it}_${projectName}" }
    }
}
