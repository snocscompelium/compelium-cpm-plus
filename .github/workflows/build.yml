name: Compilar o mod

on:
  push:
    branches: [ main, dev ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Conferir o Gradle
        uses: gradle/actions/wrapper-validation@v6

      - name: Instalar o Java
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'

      - name: Compilar
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Conferir o arquivo do mod
        run: |
          JAR=$(ls build/libs/compelium-cpm-plus-*.jar | grep -v sources | head -1)
          unzip -l "$JAR"
          mkdir -p /tmp/jar && cd /tmp/jar && unzip -q -o "$GITHUB_WORKSPACE/$JAR"
          echo "--- Nomes que os hooks do Minecraft procuram (devem estar traduzidos para intermediary) ---"
          for c in com/compelium/cpmplus/mc/mixin/*.class; do
            echo "== $c"
            javap -v "$c" | grep -E "= Utf8 " | grep -E "class_|method_|field_|render|Lnet/minecraft|Lcom/mojang" | sed 's/.*= Utf8 //' | sort -u
          done
          cat cpmplus.mixins.json cpmplus.mc.mixins.json fabric.mod.json

      - name: Guardar o arquivo do mod
        uses: actions/upload-artifact@v7
        with:
          name: compelium-cpm-plus
          path: build/libs/*.jar

      - name: Publicar nos lançamentos
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          TAG="v${VERSION}"
          JAR="build/libs/compelium-cpm-plus-${VERSION}.jar"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "O lançamento $TAG já existe; ele não é substituído. Aumente mod_version para publicar outro."
          else
            gh release create "$TAG" "$JAR" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Compelium's CPM+ ${VERSION}" \
              --notes-file docs/notas-da-versao.md
          fi
